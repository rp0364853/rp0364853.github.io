<hr><br>

<h2>🧠 AI Symptom Prediction</h2>

<div id="aiResult"></div>

<hr><br>

<input type="date" id="appointmentDate">

<option>10:00 AM</option>
<option>12:00 PM</option>

<option>5:00 PM</option>
<option>7:00 PM</option>
</select>
<button onclick="bookAppointment()">Book Now</button>
<div id="bookingResult"></div>

<hr><br>

<h2>💬 AI Chatbot</h2>
<div class="chatbox" id="chatbox"></div>
<input type="text" id="chatInput" placeholder="Ask about disease">
<button onclick="sendMessage()">Send</button>

</div>

let chart;

/* ===================== FUNCTIONS ===================== */

function searchDisease(){
let input=document.getElementById("diseaseInput").value.toLowerCase();
let result=document.getElementById("diseaseResult");
result.innerHTML="";
diseases.filter(d=>d.name.toLowerCase().includes(input))
.forEach(d=>{
result.innerHTML+=`<div class="card"><h3>${d.name}</h3>
<p>Symptoms: ${d.symptoms.join(", ")}</p></div>`;
});
}

function predictDisease(){
let input=document.getElementById("symptomInput").value.toLowerCase().split(" ");
let best=null,maxScore=0,labels=[],scores=[];

diseases.forEach(d=>{
let score=0;
d.symptoms.forEach(s=>{if(input.includes(s))score++;});
let percent=(score/d.symptoms.length)*100;
labels.push(d.name);
scores.push(percent.toFixed(1));
if(score>maxScore){maxScore=score;best=d;}
});

if(best){
let accuracy=((maxScore/best.symptoms.length)*100).toFixed(1);
document.getElementById("aiResult").innerHTML=
`<div class="card"><h3>${best.name}</h3>
<p>Accuracy: ${accuracy}%</p></div>`;
showDoctor(best.doctor);
drawChart(labels,scores);
}
}

function drawChart(labels,data){
if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:"bar",
data:{labels:labels,datasets:[{label:"Match %",data:data}]}
});
}

function showDoctor(name){
let doc=doctors.find(d=>d.name===name);
document.getElementById("doctorSection").innerHTML=
`<div class="card">
<h3>${doc.name}</h3>
<p>Specialist: ${doc.specialist}</p>
<p>Fees: ₹${doc.fees}</p>
<p>Available: ${doc.time}</p>
</div>`;
loadDoctors();
}

function loadDoctors(){
let select=document.getElementById("doctorSelect");
select.innerHTML="";
doctors.forEach(d=>{
select.innerHTML+=`<option>${d.name}</option>`;
});
}

function bookAppointment(){
let name=document.getElementById("patientName").value;
let doctor=document.getElementById("doctorSelect").value;
let date=document.getElementById("appointmentDate").value;
let time=document.getElementById("appointmentTime").value;
document.getElementById("bookingResult").innerHTML=
`<div class="card">
<h3>Booking Confirmed</h3>
<p>Patient: ${name}</p>
<p>Doctor: ${doctor}</p>
<p>Date: ${date}</p>
<p>Time: ${time}</p>
</div>`;
}

function sendMessage(){
let input=document.getElementById("chatInput").value;
let chat=document.getElementById("chatbox");
chat.innerHTML+=`<div class="user">${input}</div>`;
let reply="Use AI predictor for better result.";
diseases.forEach(d=>{
if(input.toLowerCase().includes(d.name.toLowerCase()))
reply=`${d.name} symptoms are: ${d.symptoms.join(", ")}`;
});
chat.innerHTML+=`<div class="bot">${reply}</div>`;
chat.scrollTop=chat.scrollHeight;
document.getElementById("chatInput").value="";
}

loadDoctors();

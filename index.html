<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthCare Finder</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

body{background:#f4f7fb;}

nav{
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 50px;
box-shadow:0 3px 15px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:1000;
}

nav h2{color:#0d6efd;}

nav ul{
list-style:none;
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:#333;
font-weight:500;
}

.btn{
background:#20c997;
color:white;
padding:8px 15px;
border-radius:6px;
}

.hero{
background:linear-gradient(135deg,#0d6efd,#20c997);
color:white;
text-align:center;
padding:90px 20px;
}

.hero h1{font-size:45px;margin-bottom:15px;}

.section{
padding:70px 20px;
max-width:1100px;
margin:auto;
}

.section h2{
text-align:center;
margin-bottom:40px;
}

.search-box{
display:flex;
gap:10px;
}

.search-box input{
flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

.search-box button{
padding:12px 18px;
background:#20c997;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-top:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

select,input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

form{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

form button{
width:100%;
padding:12px;
background:#0d6efd;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}
</style>
</head>
<body>

<nav>
<h2>+ HealthCare Finder</h2>
<ul>
<li><a href="#disease">Diseases</a></li>
<li><a href="#doctors">Doctors</a></li>
<li><a href="#booking">Booking</a></li>
</ul>
<a href="#booking" class="btn">Get Started</a>
</nav>

<section class="hero">
<h1>Your Health, Our Priority</h1>
<p>Find doctors, search diseases & book appointments instantly.</p>
</section>

<section class="section" id="disease">
<h2>Disease Encyclopedia</h2>
<div class="search-box">
<input type="text" id="diseaseInput" placeholder="Search disease...">
<button onclick="searchDisease()">Search</button>
</div>
<div id="diseaseResult"></div>
</section>

<section class="section" id="doctors">
<h2>Find Best Doctors</h2>
<select id="specialization">
<option>Cardiologist</option>
<option>Neurologist</option>
<option>Dermatologist</option>
</select>

<select id="sortFee">
<option value="low">Fee Low → High</option>
<option value="high">Fee High → Low</option>
</select>

<div id="doctorList"></div>
</section>

<section class="section" id="booking">
<h2>Book Appointment</h2>

<form onsubmit="bookAppointment(event)">
<input type="text" id="name" placeholder="Patient Name" required>
<input type="number" id="age" placeholder="Age" required>
<select id="gender">
<option>Male</option>
<option>Female</option>
</select>
<input type="text" id="diseaseName" placeholder="Disease" required>
<input type="date" id="date" required>
<select id="time">
<option>09:00 AM</option>
<option>11:00 AM</option>
<option>02:00 PM</option>
</select>
<button type="submit">Confirm Booking</button>
</form>

<div id="bookingMessage"></div>
</section>

<footer>
HealthCare Finder © 2026 | Hackathon Project by Rahul Poddar
</footer>

  <script>

// ================== 50+ DISEASE DATASET ==================

const diseases = [

{name:"Diabetes", symptoms:["fatigue","blurred vision","thirst","urination"]},
{name:"Hypertension", symptoms:["headache","dizziness","chest pain"]},
{name:"Malaria", symptoms:["fever","chills","sweating","headache"]},
{name:"Dengue", symptoms:["fever","joint pain","rash","muscle pain"]},
{name:"Tuberculosis", symptoms:["cough","weight loss","night sweats"]},
{name:"Asthma", symptoms:["shortness of breath","wheezing","chest tightness"]},
{name:"Migraine", symptoms:["headache","nausea","light sensitivity"]},
{name:"Covid-19", symptoms:["fever","cough","loss of smell","breathlessness"]},
{name:"Anemia", symptoms:["fatigue","weakness","pale skin"]},
{name:"Arthritis", symptoms:["joint pain","swelling","stiffness"]},
{name:"Typhoid", symptoms:["fever","weakness","abdominal pain"]},
{name:"Pneumonia", symptoms:["cough","fever","chest pain"]},
{name:"Flu", symptoms:["fever","cough","body ache"]},
{name:"Gastritis", symptoms:["stomach pain","nausea","vomiting"]},
{name:"Kidney Stone", symptoms:["back pain","blood in urine","nausea"]},
{name:"Depression", symptoms:["sadness","fatigue","sleep disturbance"]},
{name:"Anxiety", symptoms:["fear","nervousness","sweating"]},
{name:"Bronchitis", symptoms:["cough","mucus","fatigue"]},
{name:"Chickenpox", symptoms:["rash","fever","itching"]},
{name:"Measles", symptoms:["rash","fever","cough"]},
{name:"Hepatitis", symptoms:["jaundice","fatigue","abdominal pain"]},
{name:"Appendicitis", symptoms:["abdominal pain","nausea","fever"]},
{name:"Food Poisoning", symptoms:["vomiting","diarrhea","fever"]},
{name:"Cholera", symptoms:["diarrhea","dehydration","weakness"]},
{name:"Leukemia", symptoms:["fatigue","bleeding","weight loss"]},
{name:"Stroke", symptoms:["numbness","confusion","headache"]},
{name:"Heart Attack", symptoms:["chest pain","shortness of breath","nausea"]},
{name:"Sinusitis", symptoms:["headache","facial pain","congestion"]},
{name:"Ulcer", symptoms:["stomach pain","burning sensation","nausea"]},
{name:"Psoriasis", symptoms:["skin rash","itching","red patches"]},
{name:"Eczema", symptoms:["itching","dry skin","rash"]},
{name:"Obesity", symptoms:["fatigue","joint pain","breathlessness"]},
{name:"Thyroid Disorder", symptoms:["weight gain","fatigue","hair loss"]},
{name:"Parkinson's Disease", symptoms:["tremor","stiffness","slow movement"]},
{name:"Alzheimer's", symptoms:["memory loss","confusion","difficulty speaking"]},
{name:"Epilepsy", symptoms:["seizures","confusion","staring spell"]},
{name:"Liver Cirrhosis", symptoms:["jaundice","swelling","fatigue"]},
{name:"Pancreatitis", symptoms:["abdominal pain","vomiting","fever"]},
{name:"Osteoporosis", symptoms:["bone pain","fractures","back pain"]},
{name:"UTI", symptoms:["burning urination","frequent urination","pain"]},
{name:"Glaucoma", symptoms:["vision loss","eye pain","headache"]},
{name:"Cataract", symptoms:["blurred vision","cloudy vision"]},
{name:"Allergy", symptoms:["sneezing","itching","rash"]},
{name:"Mumps", symptoms:["swollen glands","fever","headache"]},
{name:"Rabies", symptoms:["fever","fear","confusion"]},
{name:"Tetanus", symptoms:["muscle stiffness","jaw locking"]},
{name:"Polio", symptoms:["weakness","paralysis","fever"]},
{name:"Zika Virus", symptoms:["rash","fever","joint pain"]},
{name:"Sickle Cell", symptoms:["pain","fatigue","swelling"]},
{name:"Lyme Disease", symptoms:["rash","fever","fatigue"]}

];

// ================== AI SYMPTOM MATCHING ==================

function predictDisease(){

let input = document.getElementById("symptomInput").value.toLowerCase();
let userSymptoms = input.split(" ");

let bestMatch = null;
let maxScore = 0;

diseases.forEach(disease => {

let score = 0;

disease.symptoms.forEach(symptom => {
if(userSymptoms.includes(symptom)){
score++;
}
});

if(score > maxScore){
maxScore = score;
bestMatch = disease.name;
}

});

let resultDiv = document.getElementById("aiResult");

if(bestMatch){
resultDiv.innerHTML = `<div class="card">
<h3>🧠 AI Prediction Result</h3>
<p><b>Possible Disease:</b> ${bestMatch}</p>
<p><b>Match Score:</b> ${maxScore}</p>
<p>⚠ This is a demo prediction. Consult a doctor.</p>
</div>`;
} else {
resultDiv.innerHTML = "<div class='card'>No matching disease found.</div>";
}

}


</script>
</body>
</html>
